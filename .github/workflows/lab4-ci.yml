name: lab4 CI/CD

on:
  push:
    branches: ["main", "feat/lab4-merge-bozo-ortho-graph", "feature/**"]
    paths:
      - "lab4/**"
      - ".github/workflows/lab4-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "lab4/**"
      - ".github/workflows/lab4-ci.yml"

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff build setuptools
          pip install --no-build-isolation --no-deps -e .

      - name: Run ruff linter
        run: ruff check .

      - name: Run pytest with coverage
        run: pytest

      - name: Run CLI non-interactive check
        run: printf "1\n2\n3\nA\n3\nB\n4\nA\nB\n2\n0\n" | python3 -m lab4_pkg.cli

      - name: Build distribution packages
        run: python3 -m build
