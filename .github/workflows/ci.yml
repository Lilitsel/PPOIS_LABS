name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8

      - name: Run linter (Flake8)
        run: |
          # Проверка кода линтером (игнорируем слишком длинные строки если нужно)
          flake8 lab1 --max-line-length=120 --statistics

      - name: Run tests and check coverage
        run: |
          # PYTHONPATH нужен для корректного импорта пакета
          export PYTHONPATH=.
          pytest --cov=lab1.cantor_set --cov=lab1.abstract_set --cov-fail-under=90 --cov-report=term-missing

      - name: Create build artifact
        run: |
          # Создаем архив с исходным кодом проекта
          mkdir -p dist
          zip -r dist/cantor-set-project.zip lab1/ README.md requirements.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-artifact
          path: dist/cantor-set-project.zip

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: project-artifact
          path: dist/

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/cantor-set-project.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}